name: Sync and Compile Ad Rules

on:
  schedule:
    - cron: '0 2 * * *' # Daily at UTC 02:00 (Beijing 10:00)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'sources.json'
      - '.github/workflows/**'

concurrency:
  group: sync-and-compile
  cancel-in-progress: false

jobs:
  sync-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Resolve sing-box latest version
        id: singbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 用 gh api（token 5000 次/小时）而非匿名 REST（60 次/小时，共享 runner IP 易被限流）
          tag=$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Unexpected sing-box release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Cache sing-box binary (keyed by version)
        id: cache-singbox
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sing-box
          key: singbox-${{ runner.os }}-${{ runner.arch }}-${{ steps.singbox.outputs.version }}

      - name: Install sing-box (latest)
        if: steps.cache-singbox.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.singbox.outputs.tag }}"
          version="${{ steps.singbox.outputs.version }}"
          case "${{ runner.arch }}" in
            X64)  arch="amd64" ;;
            ARM64) arch="arm64" ;;
            *)    echo "::error::Unsupported runner arch: ${{ runner.arch }}"; exit 1 ;;
          esac
          asset="sing-box-${version}-linux-${arch}.tar.gz"
          url="https://github.com/SagerNet/sing-box/releases/download/${tag}/${asset}"
          echo "Installing sing-box ${version} (${arch})..."
          curl -fSL --retry 3 --retry-all-errors "$url" -o sing-box.tar.gz

          # SHA-256 校验：sing-box 新版本移除了 *.tar.gz.sha256sum 旁文件
          # （v1.14 起 404，是 2026-08 之后每日 scheduled run 失败的原因）。
          # 改为读取 GitHub Release 资产自带的 digest 字段，并保留旁文件作为兜底。
          expected=""
          digest=$(gh api "repos/SagerNet/sing-box/releases/tags/${tag}" \
                     --jq ".assets[] | select(.name == \"${asset}\") | .digest // empty" || true)
          if [[ -n "$digest" ]]; then
            expected="${digest#sha256:}"
            echo "checksum source: release asset digest"
          elif curl -fsSL --retry 2 --retry-all-errors "${url}.sha256sum" \
                 -o sing-box.tar.gz.sha256sum 2>/dev/null; then
            expected=$(grep -oE '[0-9a-fA-F]{64}' sing-box.tar.gz.sha256sum | head -1 | tr 'A-F' 'a-f')
            echo "checksum source: .sha256sum sidecar"
          fi
          actual=$(sha256sum sing-box.tar.gz | awk '{print $1}')
          echo "sha256 expected: ${expected:-<unavailable>}"
          echo "sha256 actual:   ${actual}"
          if [[ -z "$expected" ]]; then
            echo "::warning::上游未提供 sha256（无 digest 也无旁文件），跳过校验"
          elif [[ "$expected" != "$actual" ]]; then
            echo "::error::sing-box 二进制 checksum 校验失败"
            exit 1
          fi

          tar -xzf sing-box.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv sing-box-*/sing-box "$HOME/.local/bin/"
          rm -rf sing-box.tar.gz sing-box-* sing-box.tar.gz.sha256sum

      - name: Verify sing-box version matches latest
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          version=$("$HOME/.local/bin/sing-box" version | head -1)
          echo "installed: $version"
          echo "expected:  ${{ steps.singbox.outputs.version }}"
          if ! "$HOME/.local/bin/sing-box" version | grep -q "${{ steps.singbox.outputs.version }}"; then
            echo "::error::sing-box 版本与 latest 不符"
            exit 1
          fi

      - name: Download rule sources (sources.json, with WAF pollution detection)
        run: python3 scripts/download-sources.py --sources sources.json --out work/sources

      - name: Convert & merge rules (adguard2headless)
        run: |
          set -euo pipefail
          shopt -s nullglob
          args=()
          for f in work/sources/adguard/*.txt; do args+=(--adguard "$f"); done
          for f in work/sources/hosts/*.hosts; do args+=(--hosts "$f"); done
          python3 scripts/adguard2headless.py "${args[@]}" -o work/out

      - name: Compile .srs (all converted + merged JSON)
        run: |
          set -euo pipefail
          shopt -s nullglob
          SUCCESS=0
          FAIL=0
          for f in work/out/converted/adguard/*.json \
                   work/out/converted/hosts/*.json \
                   work/out/merged/*/*.json; do
            out="${f%.json}.srs"
            echo "⚙️  Compiling $f -> $out"
            if sing-box rule-set compile --output "$out" "$f"; then
              echo "  ✅ ${out} ($(du -h "$out" | cut -f1))"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ❌ Failed: $f"
              FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "📊 Results: ${SUCCESS} succeeded, ${FAIL} failed"
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::${FAIL} rule-set(s) failed to compile"
            exit 1
          fi

      - name: Verify products non-empty
        run: |
          set -euo pipefail
          combined="work/out/merged/combined/combined.json"
          if [ ! -s "$combined" ]; then
            echo "::error::合并产物为空（可能上游规则退化），拒绝提交"
            exit 1
          fi
          echo "combined.json: $(stat -c %s "$combined") bytes"
          echo "merged files:"
          ls -la work/out/merged/*/

      - name: Refresh README stats (with upstream-regression guard)
        run: python3 scripts/update-readme-stats.py --readme README.md --out work/out --max-drop-pct 20

      - name: Summary
        run: |
          echo "## 📋 Rule-set Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Rule-set | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for f in work/out/merged/*/*.srs work/out/converted/*/*.srs; do
            name=${f#work/out/}
            size=$(du -h "$f" | cut -f1)
            echo "| \`${name}\` | ${size} |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🕐 Updated: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M UTC+8')" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and Push
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 只提交订阅产物（.srs）与合并后的可读 txt；中间 JSON / 上游原件已由
          # .gitignore 排除，避免每日 ~40MB 的仓库膨胀。
          git add work/out/ README.md sources.json scripts/ tests/ .github/

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update ad rules - $(date +'%Y-%m-%d')"
            # 定时与 push 触发可能重叠：push 前先 rebase 远端，避免 non-fast-forward
            git pull --rebase origin main
            git push
          fi
